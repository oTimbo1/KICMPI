services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HF_HOME: /cache/huggingface
    volumes:
      - ./pdfs:/app/pdfs
      - hf_cache:/cache/huggingface
    depends_on:
      - qdrant

volumes:
  qdrant_data:
  hf_cache: